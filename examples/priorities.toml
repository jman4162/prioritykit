# Example priorities file for `prioritykit check examples/priorities.toml`.
# Labels are illustrative. Keep your own copy in a private repository; prioritykit only reads it.

[[goal]]
id = "lead"
title = "Grow as a technical lead"
horizon = "annual"

[[goal]]
id = "family"
title = "Be present with my family"
horizon = "annual"

[[goal]]
id = "fit"
title = "Stay strong and fit"
horizon = "annual"

[[goal]]
id = "writing"
title = "Publish technical writing"
horizon = "annual"

[[goal]]
id = "mentor"
title = "Mentor a junior scientist"
horizon = "quarterly"
parent = "lead"
due = 2026-12-18   # optional; check lists it within --due-within days and warns once it passes

[[goal]]
id = "evenings"
title = "Protect weekday evenings"
horizon = "quarterly"
parent = "family"

[[goal]]
id = "strength"
title = "Strength train 3 times a week"
horizon = "quarterly"
parent = "fit"

[[goal]]
id = "monthly-post"
title = "One post a month"
horizon = "quarterly"
parent = "writing"

# Exactly three goals, each pointing at a quarterly goal. A P0 entry replaces one of them:
#   { title = "Restore the build server", p0 = true, displaces = "Review a design doc with a teammate" }
[today]
date = 2026-11-24
goals = [
  { title = "Review a design doc with a teammate", parent = "mentor" },
  { title = "Dinner and bedtime, phone in another room", parent = "evenings" },
  { title = "45-minute strength session", parent = "strength" },
]

# Past day plans, optional. Each morning, move yesterday's [today] here. check lists the goals
# that got no slot in the last 7 days (--window), counting [today]. confirmed = false marks a
# plan an agent proposed that the person has not confirmed; it works on [today] too. At the
# evening review, record each goal's outcome with done = "done", "partial", or "missed".
[[day]]
date = 2026-11-23
confirmed = false
goals = [
  { title = "Outline the December post", parent = "monthly-post" },
  { title = "Pair on the eval harness with a teammate", parent = "mentor" },
  { title = "Dinner and bedtime, phone in another room", parent = "evenings" },
]

[[day]]
date = 2026-11-22
goals = [
  { title = "45-minute strength session", parent = "strength", done = "done" },
  { title = "Family hike", parent = "evenings", done = "done" },
  { title = "Plan the week's meals", parent = "evenings", done = "partial" },
]

# The P2 list. Scores are optional, but give both or neither; rescored items that now map to P1
# or P0 are promotion candidates, and old items that still score low are deletion candidates.
# confirmed = false marks an item an agent added or scored that the person has not confirmed;
# once old, it goes to a "confirm or delete" list instead of the delete list.
[[p2]]
title = "Reorganize the photo library"
added = 2026-05-02
importance = 2
urgency = 1

[[p2]]
title = "Renew the passport before the spring trip"
added = 2026-10-01
importance = 4
urgency = 3
confirmed = false

[[p2]]
title = "Try a new note-taking app"
added = 2026-11-10
