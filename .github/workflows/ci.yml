name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: test ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest

  core-without-mcp:
    name: core installs with no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install .
      - run: prioritykit check examples/priorities.toml
      - name: the MCP commands explain the missing extra instead of a traceback
        run: |
          for cmd in "prioritykit mcp" "prioritykit-mcp"; do
            status=0
            out=$($cmd 2>&1 </dev/null) || status=$?
            echo "$cmd -> $status: $out"
            test "$status" -eq 2
            echo "$out" | grep -q "pip install 'prioritykit\[mcp\]'"
            if echo "$out" | grep -q Traceback; then exit 1; fi
          done
